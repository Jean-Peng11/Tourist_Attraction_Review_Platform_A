<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <title>Profile</title>
</head>

<body class="page-profile">
  <main class="content-container">

    <button class="profile-back-button" type="button" onclick="history.back()" aria-label="Go back">&larr;</button>

    <header class="page-header">
      <h1 class="title">Profile</h1>
    </header>

    <section class="page-section">

      <div class="profile-avatar" aria-hidden="true">
        <span class="avatar-head"></span>
        <span class="avatar-body"></span>
      </div>

      <div class="profile-info">
        <div class="profile-name">Lucia</div>
        <div class="profile-email">lucia@gmail.com</div>
      </div>

      <input id="editName" class="form-input profile-edit-input" type="text" placeholder="New name" hidden>
      <button class="profile-edit-button" type="button" onclick="updateProfile()">Edit Profile</button>

      <h2 class="signup-title">My submitted Reviews</h2>

      <div id="myReviews"></div>

    </section>

  </main>
  <script src="js/profile.js"></script>
</body>
</html>

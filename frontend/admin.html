<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="css/styles.css">
  <title>Admin Dashboard</title>
</head>

<body class="page-admin">

    <header class="page-header">
      <h1 class="title">Admin Dashboard</h1>

        <p><b>Attraction:</b> Botanic Garden</p>
        <p>"This place you must visit in Queensland!"</p>
        <div class="admin-buttons">
          <button class="admin-accept">Accept</button>
          <button class="admin-reject">Reject</button>
        </div>
      </div>

      <div class="admin-review-card">
        <p><b>Tourist:</b> Charlie</p>
        <p><b>Attraction:</b> Botanic Garden</p>
        <p>"It is a great place!"</p>
        <div class="admin-buttons">
          <button class="admin-accept">Accept</button>
          <button class="admin-reject">Reject</button>
        </div>
      </div>

    </section>

  </main>

</html>

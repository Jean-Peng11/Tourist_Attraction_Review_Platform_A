<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <title>Manage Attraction</title>
</head>

<body class="page-manage">
  <main class="content-container">

    <header class="page-header">
      <h1 class="title">Manage Attraction</h1>
    </header>

    <section class="page-section">

      <img src="Images/City Botanical Gardens Brisbane.png" class="attraction-image-large">

      <div class="form-group">
        <label class="form-label">Attraction Name</label>
        <input type="text" class="form-input">
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-input"></textarea>
      </div>

      <button class="manage-button">Submit</button>

      <h2 class="signup-title">Existing Attractions</h2>

      <div class="manage-item">
        <b>City Botanic Gardens</b>
        <p>Located in Brisbane City</p>
      </div>

    </section>

  </main>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  	<meta charset="utf-8">
  	<meta name="viewport" content="initial-scale=1, width=device-width">
  	
  	<link rel="stylesheet" href="css/styles.css"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<title>Sign Up</title>
</head>
<body>
  	<div class="signup-container">
  		<div class="signup-card">
  			<h1 class="signup-title">
  				<span class="tourist-text">Tourist<br>Sign Up</span>
  			</h1>

  			<form class="signup-form">
  				<div class="form-group">
  					<label class="form-label">Email Address</label>
  					<div class="form-input-wrapper">
  						<span class="form-icon"><i class="bi bi-envelope"></i></span>
  						<input type="email" class="form-input" placeholder="qut@gmail.com" required>
  					</div>
  				</div>

  				<div class="form-group">
  					<label class="form-label">Full Name</label>
  					<div class="form-input-wrapper">
  						<span class="form-icon"><i class="bi bi-person"></i></span>
  						<input type="text" class="form-input" placeholder="QUT" required>
  					</div>
  				</div>

  				<div class="form-group">
  					<label class="form-label">Phone Number</label>
  					<div class="form-input-wrapper">
  						<span class="form-icon"><i class="bi bi-telephone"></i></span>
  						<input type="tel" class="form-input" placeholder="+61" required>
  					</div>
  				</div>

  				<div class="form-group">
  					<label class="form-label">Password (At least 2 English letters & 6 digits)</label>
  					<div class="form-input-wrapper">
  						<span class="form-icon"><i class="bi bi-lock"></i></span>
  						<input type="password" class="form-input password-input" placeholder="••••••••" required>
  						<span class="toggle-password" title="Show/Hide"><i class="bi bi-eye"></i></span>
  					</div>
  				</div>

  				<div class="form-group">
  					<label class="form-label">Confirm Password</label>
  					<div class="form-input-wrapper">
  						<span class="form-icon"><i class="bi bi-lock"></i></span>
  						<input type="password" class="form-input password-input" placeholder="••••••••" required>
  						<span class="toggle-password" title="Show/Hide"><i class="bi bi-eye"></i></span>
  					</div>
  				</div>

  				<button type="submit" class="signup-button">Sign Up</button>

  				<div class="login-link">
  					Already have an account? <a href="./Log in.html">Log in</a>
  				</div>
  			</form>
  		</div>
  	</div>

  	<script>
  		document.querySelectorAll('.toggle-password').forEach(icon => {
  			icon.addEventListener('click', function() {
  				const input = this.previousElementSibling;
  				if (input.type === 'password') {
  					input.type = 'text';
  					this.innerHTML = '<i class="bi bi-eye-slash"></i>';
  				} else {
  					input.type = 'password';
  					this.innerHTML = '<i class="bi bi-eye"></i>';
  				}
  			});
  		});
  	</script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

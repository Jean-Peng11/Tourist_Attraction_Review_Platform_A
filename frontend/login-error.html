<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <title>Login Error</title>
</head>

<body class="page-error">
  <main class="content-container">

    <section class="page-section signup-container">

      <div class="signup-card">
        <h1 class="signup-title">Tourist<br>Log In</h1>

        <form class="signup-form">

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="form-input-wrapper">
              <input type="email" class="form-input" placeholder="qut@gmail.com">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="form-input-wrapper">
              <input type="password" class="form-input">
            </div>
          </div>

          <div class="error-message">Incorrect Email or Password. Please try again.</div>

          <button class="signup-button">Log In</button>

          <div class="login-link">
            Don't have an account? <a href="signup.html">Register</a>
          </div>

        </form>
      </div>

    </section>

  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <title>Home</title>
</head>

<body class="page-home">
  <main class="content-container">

    <header class="page-header">
      <h1 class="title">Where Next?</h1>
    </header>

    <section class="page-section">
      <div class="search-bar">
        <input type="text" class="form-input" placeholder="Search attractions">
      </div>

      <div class="filter-bar">
        <span class="filter-item">All</span>
        <span class="filter-item">Popular Spot</span>
        <span class="filter-item">Nature</span>
        <span class="filter-item">Cultural</span>
        <span class="filter-item">Recreational</span>
      </div>

      <div class="attraction-card">
        <img src="Images/City Botanical Gardens Brisbane.png" class="attraction-image">
        <div class="attraction-info">
          <div class="attraction-title">City Botanic Gardens</div>
          <div class="attraction-location">Brisbane City, QLD</div>
          <div class="attraction-reviews">5000+ Reviews</div>
        </div>
      </div>

      <div class="attraction-card">
        <img src="Images/South Bank Parklands.png" class="attraction-image">
        <div class="attraction-info">
          <div class="attraction-title">South Bank Parklands</div>
          <div class="attraction-location">South Brisbane, QLD</div>
          <div class="attraction-reviews">3000+ Reviews</div>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
